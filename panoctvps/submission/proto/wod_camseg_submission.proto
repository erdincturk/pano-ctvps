// Minimal self-contained vendoring of the WOD CameraSegmentationSubmission
// proto chain (camera_segmentation_submission -> camera_segmentation_metrics
// -> dataset.proto messages CameraSegmentationLabel + CameraName).
//
// Field numbers and wire types are IDENTICAL to the upstream definitions, so a
// CameraSegmentationSubmission serialized from this file is byte-compatible on
// the wire with one from the full waymo_open_dataset protos. Only the messages
// the 2D-VPS submission actually needs are included; the large dataset.proto
// dependency tree (label/map/vector) is intentionally dropped.
//
// Source: https://github.com/waymo-research/waymo-open-dataset,
//   src/waymo_open_dataset/{dataset.proto, protos/camera_segmentation_metrics.proto,
//   protos/camera_segmentation_submission.proto}.
// Derived from those definitions, Copyright The Waymo Open Dataset Authors,
// licensed under the Apache License, Version 2.0.
syntax = "proto2";

package waymo.open_dataset;

message CameraName {
  enum Name {
    UNKNOWN = 0;
    FRONT = 1;
    FRONT_LEFT = 2;
    FRONT_RIGHT = 3;
    SIDE_LEFT = 4;
    SIDE_RIGHT = 5;
    REAR_LEFT = 6;
    REAR = 7;
    REAR_RIGHT = 8;
  }
}

message CameraSegmentationLabel {
  optional int32 panoptic_label_divisor = 1;
  optional bytes panoptic_label = 2;
  message InstanceIDToGlobalIDMapping {
    optional int32 local_instance_id = 1;
    optional int32 global_instance_id = 2;
    optional bool is_tracked = 3;
  }
  repeated InstanceIDToGlobalIDMapping instance_id_to_global_id_mapping = 3;
  optional string sequence_id = 4;
  optional bytes num_cameras_covered = 5;
}

message CameraSegmentationFrame {
  optional CameraSegmentationLabel camera_segmentation_label = 1;
  optional string context_name = 2;
  optional int64 frame_timestamp_micros = 3;
  optional CameraName.Name camera_name = 4;
}

message CameraSegmentationFrameList {
  repeated CameraSegmentationFrame frames = 1;
}

message CameraSegmentationSubmission {
  optional string account_name = 1;
  optional string unique_method_name = 2;
  repeated string authors = 3;
  optional string affiliation = 4;
  optional string description = 5;
  optional string method_link = 6;
  optional int32 frame_dt = 7;
  optional float runtime_ms = 8;
  optional CameraSegmentationFrameList predicted_segmentation_labels = 9;
}
